name: Build Android app

# Run it from the Actions tab: "Build Android app" > "Run workflow".
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code: 1 for the first upload, then 2, 3, 4 ... (must go up every time)"
        required: true
        default: "1"
      version_name:
        description: "Version name shown to players"
        required: true
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the Android project
        uses: actions/checkout@v4

      - name: Copy the latest game from vszanz.github.io
        run: |
          git clone --depth 1 https://github.com/VSZANZ/VSZANZ.github.io.git site
          W=app/src/main/assets/www
          rm -rf "$W" && mkdir -p "$W"
          cp site/index.html site/privacy.html "$W"/
          cp -r site/fonts site/icons "$W"/
          # Offline web-app extras are not needed inside the Android app
          sed -i '/rel="manifest"/d; /serviceWorker/d' "$W/index.html"
          ls -R "$W"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 (API 36) SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Restore the signing key from repository secrets
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/upload.jks

      - name: Build the app bundle (.aab) and test APK
        env:
          KEYSTORE_PATH: upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: gradle --no-daemon :app:bundleRelease :app:assembleRelease

      - name: Remove the signing key from the build machine
        if: always()
        run: rm -f app/upload.jks

      - name: Save the files to download
        uses: actions/upload-artifact@v4
        with:
          name: kiki-glam-studio-${{ inputs.version_name }}-v${{ inputs.version_code }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
